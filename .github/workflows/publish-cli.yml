name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Version to publish from packages/cli/package.json"
        required: false
        type: string

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate requested version
        if: ${{ inputs.cli_version != '' }}
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$CURRENT_VERSION" != "${{ inputs.cli_version }}" ]; then
            echo "Expected packages/cli version ${{ inputs.cli_version }}, got $CURRENT_VERSION"
            exit 1
          fi

      - name: Lint CLI
        run: pnpm --filter @relay/cli lint

      - name: Typecheck CLI
        run: pnpm --filter @relay/cli typecheck

      - name: Build CLI
        run: pnpm --filter @relay/cli build

      - name: Publish CLI
        run: pnpm --filter @relay/cli publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
